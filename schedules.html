<html lang="en">
    <head>
        <title> Easy Schedule Maker</title>
        <link rel="stylesheet" href="style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="utf-8">
    </head>
    <body>
        
        <div class="top-left-container">
            <a href="index.html" class="nav-button">Return to Main Page</a>
        </div>

        <div class="clock">
            <div class="clock-face" id="visual-clock-face">
                <div class="number number1">1</div>
                <div class="number number2">2</div>
                <div class="number number3">3</div>
                <div class="number number4">4</div>
                <div class="number number5">5</div>
                <div class="number number6">6</div>
                <div class="number number7">7</div>
                <div class="number number8">8</div>
                <div class="number number9">9</div>
                <div class="number number10">10</div>
                <div class="number number11">11</div>
                <div class="number number12">12</div>
                <div class="hand hour-hand" id="hour-hand"></div>
                <div class="hand minute-hand" id="minute-hand"></div>
                <div class="hand second-hand" id="second-hand"></div>
                <svg id="clock-overlay" viewBox="0 0 100 100"></svg>
            </div>
        </div>
          <!--Current Date Display-->
        <div class="center">
            <h1 class="date-label">Today's Date:</h1>
            <div id="full-date" class="date-display"></div>
        </div>
        <!--Current Date Display End-->
        <h1 class="center">Your current schedules: </h1>
        
        <div class="schedules-grid">
            <div class="day-table-container" data-day="Monday">
                <h3>Monday</h3>
                <table id="table-Monday">
                    <thead><tr><th>Name</th><th>Time</th></tr></thead>
                    <tbody></tbody>
                </table>
                <div class="table-controls">
                    <button onclick="addRow('Monday')">Add Schedule</button>
                    <button onclick="removeRow('Monday')">Remove Schedule</button>
                    <button onclick="clearTable('Monday')">Clear Time Table</button>
                </div>
            </div>
            <div class="day-table-container" data-day="Tuesday">
                <h3>Tuesday</h3>
                <table id="table-Tuesday">
                    <thead><tr><th>Name</th><th>Time</th></tr></thead>
                    <tbody></tbody>
                </table>
                <div class="table-controls">
                    <button onclick="addRow('Tuesday')">Add Schedule</button>
                    <button onclick="removeRow('Tuesday')">Remove Schedule</button>
                    <button onclick="clearTable('Tuesday')">Clear Time Table</button>
                </div>
            </div>
            <div class="day-table-container" data-day="Wednesday">
                <h3>Wednesday</h3>
                <table id="table-Wednesday">
                    <thead><tr><th>Name</th><th>Time</th></tr></thead>
                    <tbody></tbody>
                </table>
                <div class="table-controls">
                    <button onclick="addRow('Wednesday')">Add Schedule</button>
                    <button onclick="removeRow('Wednesday')">Remove Schedule</button>
                    <button onclick="clearTable('Wednesday')">Clear Time Table</button>
                </div>
            </div>
            <div class="day-table-container" data-day="Thursday">
                <h3>Thursday</h3>
                <table id="table-Thursday">
                    <thead><tr><th>Name</th><th>Time</th></tr></thead>
                    <tbody></tbody>
                </table>
                <div class="table-controls">
                    <button onclick="addRow('Thursday')">Add Schedule</button>
                    <button onclick="removeRow('Thursday')">Remove Schedule</button>
                    <button onclick="clearTable('Thursday')">Clear Time Table</button>
                </div>
            </div>
            <div class="day-table-container" data-day="Friday">
                <h3>Friday</h3>
                <table id="table-Friday">
                    <thead><tr><th>Name</th><th>Time</th></tr></thead>
                    <tbody></tbody>
                </table>
                <div class="table-controls">
                    <button onclick="addRow('Friday')">Add Schedule</button>
                    <button onclick="removeRow('Friday')">Remove Schedule</button>
                    <button onclick="clearTable('Friday')">Clear Time Table</button>
                </div>
            </div>
            <div class="day-table-container" data-day="Saturday">
                <h3>Saturday</h3>
                <table id="table-Saturday">
                    <thead><tr><th>Name</th><th>Time</th></tr></thead>
                    <tbody></tbody>
                </table>
                <div class="table-controls">
                    <button onclick="addRow('Saturday')">Add Schedule</button>
                    <button onclick="removeRow('Saturday')">Remove Schedule</button>
                    <button onclick="clearTable('Saturday')">Clear Time Table</button>
                </div>
            </div>
            <div class="day-table-container sunday-container" data-day="Sunday">
                <h3>Sunday</h3>
                <table id="table-Sunday">
                    <thead><tr><th>Name</th><th>Time</th></tr></thead>
                    <tbody></tbody>
                </table>
                <div class="table-controls">
                    <button onclick="addRow('Sunday')">Add Schedule</button>
                    <button onclick="removeRow('Sunday')">Remove Schedule</button>
                    <button onclick="clearTable('Sunday')">Clear Time Table</button>
                </div>
            </div>
        </div>

    <script src="script.js"></script>
    </body>
</html>
